[package]
name = "crypto-orderbook"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
description = "Correctly sequenced order books for Binance spot and USD-M futures, Coinbase Advanced Trade and Kraken v2 (checksum-validated): sans-IO sync state machines behind one API, plus a Binance service over HTTP, WebSocket and Prometheus"
license = "MIT"
repository = "https://github.com/Mattbusel/crypto-orderbook"
documentation = "https://docs.rs/crypto-orderbook"
homepage = "https://github.com/Mattbusel/crypto-orderbook"
readme = "README.md"
keywords = ["orderbook", "binance", "coinbase", "kraken", "market-data"]
categories = ["command-line-utilities", "finance", "network-programming"]
exclude = ["docs/", "Dockerfile"]

[dependencies]
# Async runtime — use full during dev, narrow features before prod
tokio = { version = "1", features = ["full"] }

# WebSocket — async wrapper around tungstenite, integrates with tokio I/O
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Stream/sink combinators for WebSocket frames
futures-util = "0.3"

# Serialization — derive on serde to get #[derive(Deserialize, Serialize)]
serde = { version = "1", features = ["derive"] }
# raw_value: read Kraken prices and quantities without going through f64
serde_json = { version = "1", features = ["raw_value"] }

# Exact decimal arithmetic — never use f64 for financial prices
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# HTTP client for fetching REST snapshots from Binance
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Typed error enums with std::error::Error derive
thiserror = "1"

# Tokio-native HTTP framework
axum = { version = "0.7", features = ["ws"] }

# Structured async-aware logging with task span context
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Typed URL construction
url = "2"

# Prometheus metrics exposition
prometheus = "0.13"

# Lazy statics for global metric handles
once_cell = "1"

# Tower middleware: request timeouts
tower-http = { version = "0.5", features = ["timeout"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
