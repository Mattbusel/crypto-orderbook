[package]
name = "crypto-orderbook"
version = "0.5.2"
edition = "2021"
rust-version = "1.88"
description = "Your local order book is wrong after the first dropped message. Sans-IO sync state machines for Binance spot and USD-M, Coinbase and Kraken (checksum-validated) that clear the book on any gap instead of serving it; optional Binance service over HTTP, WebSocket and Prometheus."
license = "MIT"
repository = "https://github.com/Mattbusel/crypto-orderbook"
documentation = "https://docs.rs/crypto-orderbook"
readme = "README.md"
keywords = ["orderbook", "binance", "market-data", "sans-io", "trading"]
categories = ["command-line-utilities", "finance", "network-programming"]
exclude = ["docs/", "Dockerfile"]

[dependencies]
# Async runtime — use full during dev, narrow features before prod
tokio = { version = "1", features = ["full"], optional = true }

# WebSocket — async wrapper around tungstenite, integrates with tokio I/O
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }

# Stream/sink combinators for WebSocket frames
futures-util = { version = "0.3", optional = true }

# Serialization — derive on serde to get #[derive(Deserialize, Serialize)]
serde = { version = "1", features = ["derive"] }
# raw_value: read Kraken prices and quantities without going through f64
serde_json = { version = "1", features = ["raw_value"] }

# Exact decimal arithmetic — never use f64 for financial prices
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# HTTP client for fetching REST snapshots from Binance
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Typed error enums with std::error::Error derive
thiserror = "1"

# Tokio-native HTTP framework
axum = { version = "0.7", features = ["ws"], optional = true }

# Structured async-aware logging with task span context
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Typed URL construction
url = { version = "2", optional = true }

# Prometheus metrics exposition
prometheus = { version = "0.13", optional = true }

# Lazy statics for global metric handles
once_cell = { version = "1", optional = true }

# Tower middleware: request timeouts
tower-http = { version = "0.5", features = ["timeout"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
default = ["service"]
# The Binance service (src/main.rs) and its plumbing: Tokio, Axum, reqwest, Prometheus.
# `default-features = false` leaves only the sans-IO sync state machines, the book and the
# parsers, on serde, serde_json, rust_decimal and thiserror.
service = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:reqwest",
    "dep:axum",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:prometheus",
    "dep:once_cell",
    "dep:tower-http",
]

[[bin]]
name = "crypto-orderbook"
path = "src/main.rs"
required-features = ["service"]

[[example]]
name = "follow_book"
required-features = ["service"]

[[example]]
name = "follow_venue"
required-features = ["service"]

[[test]]
name = "api_integration"
required-features = ["service"]

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
